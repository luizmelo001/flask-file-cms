[project]
name = "cms"
version = "0.1.0"
description = ""
authors = [
    {name = "Luiz Melo",email = "luizmelo001@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "markdown (>=3.10.2,<4.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)"
]

[tool.poetry]
packages = [{include = "cms", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
test = [
    "pytest (>=9.0.3,<10.0.0)"
]
dev = [
    "pytest (>=9.0.3,<10.0.0)"
]
