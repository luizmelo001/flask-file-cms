<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>File List</title>
</head>
<body>
  {% for message in get_flashed_messages() %}
    <p style="color: red;">{{ message }}</p>
  {% endfor %}

  
  <ul>
    {% for file in documents %}
      <li><a href="{{ url_for('file_content', filename=file) }}">{{ file }}</a></li>
    {% endfor %}
  </ul>
</body>
</html>
